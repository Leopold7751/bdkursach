{% extends "base.html" %}
{% block title %}Регистрация — QuizPlatform{% endblock %}
{% block content %}

<div style="max-width:420px; margin:3rem auto;">
  <h1 style="margin-bottom:0.25rem;">Регистрация</h1>
  <p>Уже есть аккаунт? <a href="{{ url_for('login') }}" style="color:var(--accent);">Войдите</a></p>

  <div class="card" style="margin-top:1.5rem;">
    <form method="POST">
      <div class="form-group">
        <label>Логин</label>
        <input type="text" name="login" placeholder="ваш_логин" required autofocus>
      </div>
      <div class="form-group">
        <label>Отображаемое имя</label>
        <input type="text" name="display_name" placeholder="Иванов И.И." required>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" placeholder="минимум 6 символов" required>
      </div>
      <div class="form-group">
        <label>Роль</label>
        <select name="role">
          <option value="student">Студент (участник тестов)</option>
          <option value="author">Составитель (создание тестов)</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Зарегистрироваться</button>
    </form>
  </div>
</div>

{% endblock %}
